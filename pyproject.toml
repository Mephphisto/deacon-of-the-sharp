[project]
name = "deconv"
version = "0.1.0"
description = "ML-based PSF estimation and deconvolution for 2D microscopy images"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["deconv*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["deconv", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
